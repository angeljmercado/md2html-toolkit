<style>
/* Collapsible outline sidebar (styles pandoc's nav#TOC). Colors come
   from the design tokens in doc-style.css. */
nav#TOC {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 270px;
  overflow-y: auto;
  padding: 3.2rem 1rem 2rem;
  background: var(--surface);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform .22s ease;
  z-index: 100;
  font-size: .88rem;
}
body.toc-open nav#TOC { transform: none; }
nav#TOC::before {
  content: "Outline";
  display: block;
  font-weight: 600;
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--fg-muted);
  margin-bottom: .6rem;
}
nav#TOC ul { list-style: none; padding-left: 0; margin: 0; }
nav#TOC ul ul { padding-left: .9rem; }
nav#TOC li { margin: .1rem 0; }
nav#TOC a {
  display: block;
  padding: .25rem .5rem;
  border-radius: 5px;
  color: var(--fg-soft);
  text-decoration: none;
  line-height: 1.35;
}
nav#TOC a:hover { background: var(--hover-bg); color: var(--fg); }

#toc-toggle {
  position: fixed;
  top: .7rem; left: .7rem;
  z-index: 101;
  width: 2.2rem; height: 2.2rem;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg-soft);
}
#toc-toggle:hover { background: var(--surface); color: var(--accent); }

/* On wide screens, push the content over while the panel is open */
@media (min-width: 1100px) {
  body.toc-open { margin-left: calc(290px + max(0px, (100% - 290px - 46rem) / 2)); }
}

@media (prefers-color-scheme: dark) {
  /* Magenta "Outline" label is a deliberate dark-mode accent */
  nav#TOC::before { color: var(--accent); }
}

@media print {
  nav#TOC, #toc-toggle { display: none; }
  body.toc-open { margin-left: auto; }
}
</style>
<script>
(function () {
  var toc = document.getElementById("TOC");
  if (!toc) return;
  var btn = document.createElement("button");
  btn.id = "toc-toggle";
  btn.setAttribute("aria-label", "Toggle outline");
  btn.textContent = "☰"; /* ☰ */
  document.body.appendChild(btn);
  function setOpen(open) {
    document.body.classList.toggle("toc-open", open);
    btn.textContent = open ? "×" : "☰"; /* × / ☰ */
  }
  btn.addEventListener("click", function () {
    setOpen(!document.body.classList.contains("toc-open"));
  });
  /* Start open on wide screens, collapsed on narrow ones */
  setOpen(window.innerWidth >= 1100);
  /* On narrow screens, close the panel after picking a section */
  toc.addEventListener("click", function (e) {
    if (e.target.tagName === "A" && window.innerWidth < 1100) setOpen(false);
  });
})();
</script>
